name: Hotfix

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to fix'
        required: true
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: releases/${{ github.event.inputs.release_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: releases/${{ github.event.inputs.release_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  hotfix:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: releases/${{ github.event.inputs.release_version }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Set fix version
        id: fix_version
        run: echo "FIX_VERSION=${{ github.event.inputs.release_version }}_fix${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Configure Docker for Yandex Container Registry
        run: |
          echo "${{ secrets.YANDEX_CLOUD_SA_KEY }}" | docker login --username json_key --password-stdin cr.yandex

      - name: Build Docker image
        run: |
          docker build -t cr.yandex/fv4dhag06365tj3kufig/app:${{ steps.fix_version.outputs.FIX_VERSION }} .
          docker tag cr.yandex/fv4dhag06365tj3kufig/app:${{ steps.fix_version.outputs.FIX_VERSION }} cr.yandex/fv4dhag06365tj3kufig/app:${{ github.event.inputs.release_version }}_latest

      - name: Push Docker image
        run: |
          docker push cr.yandex/fv4dhag06365tj3kufig/app:${{ steps.fix_version.outputs.FIX_VERSION }}
          docker push cr.yandex/fv4dhag06365tj3kufig/app:${{ github.event.inputs.release_version }}_latest

      - name: Create git tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.fix_version.outputs.FIX_VERSION }}
          git push origin ${{ steps.fix_version.outputs.FIX_VERSION }}

      - name: Get commits since last release/fix
        id: commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline)
          else
            COMMITS=$(git log --oneline $LAST_TAG..HEAD)
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Find release issue
        id: issue
        run: |
          ISSUE_NUMBER=$(gh issue list --search "Release ${{ github.event.inputs.release_version }}" --state all --limit 1 --json number --jq '.[0].number')
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add comment to release issue
        run: |
          gh issue comment ${{ steps.issue.outputs.issue_number }} --body "**Hotfix Applied:**

          - **Date:** $(date)
          - **Author:** ${{ github.actor }}
          - **Fix Version:** ${{ steps.fix_version.outputs.FIX_VERSION }}
          - **Docker Image:** cr.yandex/fv4dhag06365tj3kufig/app:${{ steps.fix_version.outputs.FIX_VERSION }}

          **Commits:**
          ${{ steps.commits.outputs.commits }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
