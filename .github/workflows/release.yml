name: Release

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  release:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Set version
        id: version
        run: echo "VERSION=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create release branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b releases/${{ steps.version.outputs.VERSION }}
          git push origin releases/${{ steps.version.outputs.VERSION }}

      - name: Configure Docker for Yandex Container Registry
        run: |
          echo "${{ secrets.YANDEX_CLOUD_SA_KEY }}" | docker login --username json_key --password-stdin cr.yandex

      - name: Build Docker image
        run: |
          docker build -t cr.yandex/fv4dhag06365tj3kufig/app:${{ steps.version.outputs.VERSION }} .
          docker tag cr.yandex/fv4dhag06365tj3kufig/app:${{ steps.version.outputs.VERSION }} cr.yandex/fv4dhag06365tj3kufig/app:${{ steps.version.outputs.VERSION }}_latest

      - name: Push Docker image
        run: |
          docker push cr.yandex/fv4dhag06365tj3kufig/app:${{ steps.version.outputs.VERSION }}
          docker push cr.yandex/fv4dhag06365tj3kufig/app:${{ steps.version.outputs.VERSION }}_latest

      - name: Create git tag
        run: |
          git tag ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }}

      - name: Get commits since last release
        id: commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline)
          else
            COMMITS=$(git log --oneline $LAST_TAG..HEAD)
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue
        run: |
          gh issue create \
            --title "Release ${{ steps.version.outputs.VERSION }}" \
            --body "**Release Information:**

          - **Date:** $(date)
          - **Author:** ${{ github.actor }}
          - **Version:** ${{ steps.version.outputs.VERSION }}
          - **Docker Image:** cr.yandex/fv4dhag06365tj3kufig/app:${{ steps.version.outputs.VERSION }}

          **Commits:**
          ${{ steps.commits.outputs.commits }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG
        run: |
          echo "## Version ${{ steps.version.outputs.VERSION }} - $(date)" > temp_changelog.md
          echo "" >> temp_changelog.md
          echo "${{ steps.commits.outputs.commits }}" >> temp_changelog.md
          echo "" >> temp_changelog.md
          cat CHANGELOG.md >> temp_changelog.md
          mv temp_changelog.md CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG for version ${{ steps.version.outputs.VERSION }}"
          git push origin releases/${{ steps.version.outputs.VERSION }}
